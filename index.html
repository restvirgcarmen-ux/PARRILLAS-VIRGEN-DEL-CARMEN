<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parrillas Virgen del Carmen - Sistema de Gestión</title>
    <style>
        /* --- ESTILOS GLOBALES --- */
        :root {
            --bg-navbar: #000000;
            --bg-sistema: #ebf5fb; 
            --texto-blanco: #ffffff;
            --texto-oscuro: #2c3e50;
            --btn-negro: #000000;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-sistema);
            color: var(--texto-oscuro);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- NAVBAR FIJO --- */
        .navbar {
            background-color: var(--bg-navbar);
            color: var(--texto-blanco);
            padding: 15px 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .navbar-brand {
            display: flex;
            flex-direction: column;
        }
        .navbar-title {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin: 0;
            text-transform: uppercase;
        }
        .navbar-subtitle {
            font-size: 0.75rem;
            color: #bdc3c7;
            margin: 3px 0 0 0;
            font-weight: normal;
        }

        /* --- CONTENEDOR DE PANTALLAS --- */
        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .view-screen {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            transition: opacity 0.5s ease, transform 0.5s ease;
            opacity: 1;
            transform: scale(1);
        }

        .view-screen.fade-out {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }

        .hidden {
            display: none !important;
        }

        /* --- PANTALLA 1: LOGIN --- */
        .login-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }
        .input-password {
            width: 100%;
            padding: 12px;
            font-size: 1.5rem;
            letter-spacing: 12px;
            text-align: center;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
            margin-bottom: 15px;
        }
        .input-password:focus {
            border-color: #34495e;
        }

        /* Modales de alerta personalizados */
        .modal-alert {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex; justify-content: center; align-items: center;
            z-index: 2000;
        }
        .modal-alert-box {
            background: white; padding: 25px; border-radius: 8px;
            max-width: 320px; width: 85%; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-alert-title { color: #e74c3c; font-weight: bold; font-size: 1.2rem; margin-bottom: 10px; }
        .modal-alert-text { color: #555; font-size: 0.95rem; margin-bottom: 15px; line-height: 1.4; }
        .btn-alert-close {
            background: var(--btn-negro); color: white; border: none;
            padding: 8px 20px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }

        /* --- PANTALLA 2: APERTURA CAJA --- */
        .caja-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 25px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            padding: 10px 12px;
            font-size: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
            box-sizing: border-box;
        }
        .form-input:focus {
            border-color: #000;
        }
        
        .animated-field {
            animation: slideDown 0.3s ease-out forwards;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-submit {
            width: 100%;
            background-color: var(--btn-negro);
            color: var(--texto-blanco);
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #222;
        }
    </style>
</head>
<body>

    <!-- NAVBAR PERMANENTE -->
    <nav class="navbar">
        <div class="navbar-brand">
            <h1 class="navbar-title">PARRILLAS VIRGEN DEL CARMEN</h1>
            <h2 class="navbar-subtitle">Calle Tumbes 331 La Unión Piura</h2>
        </div>
    </nav>

    <!-- CONTENEDOR CENTRAL -->
    <main class="main-container">

        <!-- ================= PANTALLA 1: LOGIN ================= -->
        <section id="screen-login" class="view-screen">
            <div class="login-title">Ingrese su clave de seguridad</div>
            <!-- El formulario ahora captura el evento submit de forma nativa -->
            <form id="login-form" onsubmit="validarClaveManual(event)">
                <input type="password" name="seguridad_pin" id="input-pin" class="input-password" maxlength="6" inputmode="numeric" pattern="[0-9]*" autofocus placeholder="••••••" required>
                <button type="submit" class="btn-submit">Ingresar</button>
            </form>
        </section>

        <!-- ================= PANTALLA 2: APERTURA DE CAJA ================= -->
        <section id="screen-caja" class="view-screen hidden">
            <div class="caja-title">Aperturar caja</div>
            
            <div class="form-group">
                <label for="input-dni">Número de DNI</label>
                <input type="text" id="input-dni" class="form-input" maxlength="8" inputmode="numeric" pattern="[0-9]*" placeholder="Ingrese 8 dígitos" autocomplete="off">
            </div>

            <div id="wrapper-nombre" class="form-group hidden animated-field">
                <label for="input-nombre">Nombres y Apellidos</label>
                <input type="text" id="input-nombre" class="form-input" placeholder="Ej: Juan Pérez Morales">
            </div>

            <button class="btn-submit" onclick="procesarAperturaCaja()">Aperturar Caja</button>
        </section>

    </main>

    <!-- ALERTA EMERGENTE PERSONALIZADA -->
    <div id="custom-alert" class="modal-alert hidden">
        <div class="modal-alert-box">
            <div id="alert-title" class="modal-alert-title">Error</div>
            <div id="alert-text" class="modal-alert-text">Mensaje</div>
            <button class="btn-alert-close" onclick="cerrarAlerta()">Aceptar</button>
        </div>
    </div>

    <!-- CONTROLADORES -->
    <script>
        const CLAVE_SISTEMA = "123456"; 
        let intentosFallidos = 0;
        let sistemaBloqueado = false;

        let bdUsuariosSimulada = JSON.parse(localStorage.getItem('bd_dni_usuarios')) || {};

        // Escuchar la entrada de DNI de forma limpia
        document.getElementById("input-dni").addEventListener("input", function() {
            if (this.value.length === 8) {
                verificarExistenciaDNI(this.value);
            } else {
                document.getElementById("wrapper-nombre").classList.add("hidden");
            }
        });

        function mostrarAlerta(titulo, mensaje) {
            document.getElementById("alert-title").innerText = titulo;
            document.getElementById("alert-text").innerText = mensaje;
            document.getElementById("custom-alert").classList.remove("hidden");
        }

        function cerrarAlerta() {
            document.getElementById("custom-alert").classList.add("hidden");
            if (!sistemaBloqueado) {
                document.getElementById("input-pin").focus();
            }
        }

        // --- VALIDACIÓN LOGÍSTICA COMPLETA ---
        function validarClaveManual(event) {
            if (event) event.preventDefault();
            if (sistemaBloqueado) return;

            // Extraemos el valor del formulario de manera nativa para evitar problemas de lectura del DOM
            const form = document.getElementById("login-form");
            const formData = new FormData(form);
            const valorIngresado = formData.get("seguridad_pin");

            if (!valorIngresado) return;

            if (valorIngresado === CLAVE_SISTEMA) {
                intentosFallidos = 0;
                ejecutarTransicionA(document.getElementById("screen-login"), document.getElementById("screen-caja"));
