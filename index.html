<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byte - Picantería Virgen del Carmen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Encabezado del Sistema -->
    <header class="system-header">
        <div class="header-brand">
            <span class="brand-icon">🍽️</span>
            <div>
                <h1>BYTE</h1>
                <h2>PICANTERÍA VIRGEN DEL CARMEN</h2>
            </div>
        </div>
        <div class="header-menu">☰</div>
    </header>

    <main class="container">
        <!-- VISTA 1: PLANO DE MESAS Y ZONAS -->
        <section id="vista-mesas" class="view-section">
            <!-- Alerta de Impresión -->
            <div class="alert-box">
                ⚠️ <strong>¡Importante!</strong> La configuración de impresión está incompleta
            </div>

            <!-- Acordeón Zona Principal -->
            <div class="accordion-zone active" data-zone="principal">
                <div class="accordion-header zone-principal-bar" onclick="toggleZone('principal')">
                    <span>🪑 PRINCIPAL - <span id="count-principal">3</span> Activas</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="accordion-content grid-mesas" id="zone-content-principal">
                    <!-- Las mesas se generarán dinámicamente con JavaScript -->
                </div>
            </div>

            <!-- Acordeón Zona Adentro -->
            <div class="accordion-zone" data-zone="adentro">
                <div class="accordion-header zone-adentro-bar" onclick="toggleZone('adentro')">
                    <span>🏠 ADENTRO - 0 Activas</span>
                    <span class="arrow">▶</span>
                </div>
                <div class="accordion-content grid-mesas hidden" id="zone-content-adentro"></div>
            </div>
        </section>

        <!-- VISTA 2: PUNTO DE VENTA / COMANDAS -->
        <section id="vista-pos" class="view-section hidden">
            <div class="pos-layout">
                <!-- Panel de Menú / Productos (Izquierda) -->
                <div class="pos-menu-panel">
                    <div class="search-container">
                        <input type="text" placeholder="Buscar..." class="search-input">
                    </div>
                    
                    <!-- Categorías / Productos Grid -->
                    <div class="menu-grid" id="grid-categorias-productos">
                        <!-- Categorías Base -->
                        <button class="btn-category cat-naranja" onclick="cargarProductos('alitas')">ALITAS</button>
                        <button class="btn-category cat-azul" onclick="cargarProductos('cebiches')">CEBICHES</button>
                        <button class="btn-category cat-verde" onclick="cargarProductos('rondas')">RONDAS</button>
                        <button class="btn-category cat-rojo" onclick="cargarProductos('carnes')">CARNES</button>
                    </div>
                </div>

                <!-- Panel de Detalle del Pedido (Derecha) -->
                <div class="pos-order-panel">
                    <div class="order-header-info">
                        <div><strong>MESA:</strong> <span id="pos-mesa-num">01</span></div>
                        <div><strong>MOZO:</strong> Gerardo</div>
                    </div>

                    <div class="order-table-container">
                        <table class="order-table">
                            <thead>
                                <tr>
                                    <th>Item</th>
                                    <th>Cnt</th>
                                    <th>St</th>
                                    <th>Total</th>
                                </tr>
                            </thead>
                            <tbody id="order-items-body">
                                <tr>
                                    <td colspan="4" class="empty-cart">Sin Ítems Aún</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Panel de Acciones y Totales -->
                    <div class="order-summary">
                        <div class="summary-row">Items: <span id="summary-count">0</span></div>
                        <div class="summary-row total-row">Total: S/ <span id="summary-total">0.00</span></div>
                    </div>

                    <div class="pos-actions-grid">
                        <button class="btn-action action-green" onclick="enviarPedido()">📝 Enviar Pedido</button>
                        <button class="btn-action action-cyan">🖨️ Imprimir Cuenta</button>
                        <button class="btn-action action-blue" onclick="finalizarVenta()">💵 Finalizar Venta</button>
                        <button class="btn-action action-red" onclick="volverAMesas()">⬅️ Volver a Mesas</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- VENTANA MODAL: APERTURAR MESA -->
    <div id="modal-apertura" class="modal-backdrop hidden">
        <div class="modal-box">
            <h3>Aperturar Mesa <span id="modal-mesa-id">00</span></h3>
            <div class="form-group">
                <label>Cliente</label>
                <input type="text" id="input-cliente" placeholder="Ingresa un nombre">
            </div>
            <div class="form-group">
                <label>Personas</label>
                <div class="counter-control">
                    <button onclick="updatePersonas(-1)">-</button>
                    <input type="number" id="input-personas" value="1" readonly>
                    <button onclick="updatePersonas(1)">+</button>
                </div>
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
                <button class="btn-confirm" onclick="confirmarApertura()">Aperturar Mesa</button>
            </div>
        </div>
    </div>
</body>
</html>
